services:
  # ---------------- Backend: FastAPI (Docker) ----------------
  - type: web
    name: backend
    runtime: docker
    plan: free               # change to starter/standard when ready for production
    dockerfilePath: ./backend/Dockerfile   # relative to REPO ROOT
    dockerContext: ./backend                # api/ is now self-contained (core/process/utils nested inside)
    healthCheckPath: /health   # uses the dedicated health endpoint in main.py
    envVars:
      - key: MISTRAL_API_KEY
        sync: false           # fill in manually in the Render dashboard after first deploy
      - key: TAVILY_API_KEY
        sync: false           # fill in manually in the Render dashboard after first deploy
      - key: JWT_SECRET_KEY
        generateValue: true   # Render auto-generates a strong random secret — never redeploy-unstable
      - key: DATABASE_URL
        sync: false            # paste your Supabase connection string here after deploy

  # ---------------- Frontend: Streamlit (Docker) ----------------
  - type: web
    name: frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile   # relative to REPO ROOT
    dockerContext: .                         # repo root — requirements.txt lives here
    envVars:
      - key: API_BASE
        sync: false           # set manually to the backend's public URL after first deploy,
                               # e.g. https://backend-xxxx.onrender.com  (no trailing slash)
      - key: COOKIE_PASSWORD
        generateValue: true   # Render auto-generates a strong random secret for you