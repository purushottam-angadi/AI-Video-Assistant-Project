services:
  # ---------------- Backend: FastAPI (Docker) ----------------
  - type: web
    name: backend
    runtime: docker
    plan: free               # change to starter/standard when ready for production
    rootDir: backend           # build context — must still contain requirements.txt and the api/ folder
    dockerfilePath: ./api/Dockerfile   # Dockerfile lives inside backend/api/
    healthCheckPath: /docs    # FastAPI auto-serves this; swap for a real /health route if you have one
    envVars:
      - key: MISTRAL_API_KEY
        sync: false           # fill in manually in the Render dashboard after first deploy
      - key: TAVILY_API_KEY
        sync: false           # fill in manually in the Render dashboard after first deploy

  # ---------------- Frontend: Streamlit (Docker) ----------------
  - type: web
    name: frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_BASE
        sync: false           # set manually to the backend's public URL after first deploy,
                               # e.g. https://backend-xxxx.onrender.com  (no trailing slash)
      - key: COOKIE_PASSWORD
        generateValue: true   # Render auto-generates a strong random secret for you